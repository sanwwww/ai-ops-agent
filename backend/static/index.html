<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能运维助手 Ops Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --bg: #0b0f17; --panel: #111722; --panel2: #161e2d; --border: #1f2937;
    --text: #e6edf3; --muted: #8b98a9; --accent: #3b82f6; --green: #22c55e;
    --amber: #f59e0b; --red: #ef4444; --mono: Consolas, "JetBrains Mono", monospace;
  }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .sidebar { width: 250px; min-width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .logo { padding: 18px 16px; border-bottom: 1px solid var(--border); }
  .logo h1 { font-size: 16px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .logo h1 .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .logo p { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sec h3 { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 10px; }
  .kv { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-family: var(--mono); color: var(--text); }
  .kv .ok { color: var(--green); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-family: var(--mono); color: var(--accent); }
  .stat span { font-size: 11px; color: var(--muted); }
  .hist-item { font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
  .hist-item:hover { background: var(--panel2); color: var(--text); }
  .hist-item.active { border-color: var(--accent); color: var(--text); }
  .btn-new { width: 100%; padding: 9px; background: transparent; border: 1px dashed #2c3a52; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 12.5px; margin-top: 8px; }
  .btn-new:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px; }
  .topbar .burger { display: none; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  .topbar .timer { margin-left: auto; font-family: var(--mono); color: var(--amber); font-size: 12px; }
  .topbar .model { font-family: var(--mono); color: var(--muted); font-size: 12px; }

  #messages { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .msg { margin: 14px 0; max-width: 88%; }
  .msg .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.75; font-size: 14.5px; word-break: break-word; }
  .user { margin-left: auto; }
  .user .bubble { background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot .bubble p { margin: 6px 0; }
  .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 { margin: 10px 0 6px; font-size: 15px; color: #7db4f5; }
  .bot .bubble ul { padding-left: 20px; }
  .bot .bubble pre { position: relative; background: #0a0e14; border: 1px solid #223047; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bot .bubble pre code { font-family: var(--mono); color: #9ecbff; }
  .bot .bubble code { font-family: var(--mono); font-size: 13px; background: #0a0e14; padding: 1px 5px; border-radius: 4px; color: #9ecbff; }
  .bot .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bot .bubble th, .bot .bubble td { border: 1px solid #2c3a52; padding: 5px 10px; }
  .bot .bubble th { background: #182234; }
  .bot .bubble blockquote { border-left: 3px solid var(--amber); padding-left: 10px; color: var(--muted); margin: 6px 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: #1c2941; color: var(--muted); border: 1px solid #2c3a52; border-radius: 5px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .stream-text { white-space: pre-wrap; }

  .step-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 12.5px; }
  .step-card .tool { font-family: var(--mono); color: var(--amber); font-weight: bold; }
  .step-card .args { font-family: var(--mono); color: var(--muted); }
  .step-card .result { font-family: var(--mono); color: var(--green); margin-top: 4px; white-space: pre-wrap; }
  .step-card.running { border-left-color: var(--accent); }
  .step-card.running::after { content: " ⟳ 执行中"; color: var(--accent); font-size: 11px; }
  .step-card.done { border-left-color: var(--green); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 8px; }
  .chips button { padding: 7px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 18px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .chips button:hover { color: var(--accent); border-color: var(--accent); }
  .input-row { display: flex; gap: 10px; padding: 14px 26px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  input { flex: 1; padding: 12px 16px; background: var(--panel2); border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  button.send { padding: 12px 26px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
  button.send:disabled { background: #1e3a5f; color: #5f7fae; }
  footer { text-align: center; font-size: 11px; color: #556070; padding: 0 0 8px; background: var(--panel); }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #3a4a63; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  @media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 10; left: -250px; transition: left .25s; height: 100vh; }
    .sidebar.open { left: 0; }
    .topbar .burger { display: block; }
    #messages, .chips, .input-row { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <h1><span class="pulse"></span>OPS AGENT</h1>
      <p>AI Network Operations</p>
    </div>
    <div class="sec">
      <h3>AGENT 状态</h3>
      <div class="kv"><span>模型</span><span id="stModel">deepseek-chat</span></div>
      <div class="kv"><span>服务状态</span><span class="ok">● 在线</span></div>
      <div class="kv"><span>排查链路</span><span>DNS→Ping→Port→HTTP</span></div>
    </div>
    <div class="sec">
      <h3>本次会话</h3>
      <div class="stat-grid">
        <div class="stat"><b id="stQ">0</b><span>提问数</span></div>
        <div class="stat"><b id="stT">0</b><span>工具调用</span></div>
        <div class="stat"><b id="stS">-</b><span>最近耗时/s</span></div>
        <div class="stat"><b id="stM">1</b><span>会话轮次</span></div>
      </div>
    </div>
    <div class="sec" style="flex:1">
      <h3>历史会话</h3>
      <div id="histList"></div>
      <button class="btn-new" onclick="newSession()">＋ 新建会话</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:600">网络故障智能排查控制台</span>
      <span class="model" id="tbModel">LLM + Tool Calling · SSE</span>
      <span class="timer" id="timer"></span>
    </div>
    <div id="messages"></div>
    <div class="chips" id="chips">
      <button onclick="fill(this)">网站打不开了，帮我排查 example.com</button>
      <button onclick="fill(this)">baidu.com 的 443 端口通吗</button>
      <button onclick="fill(this)">检查 https://www.baidu.com 是否正常</button>
    </div>
    <div class="input-row">
      <input id="input" maxlength="500" placeholder="描述你的运维问题，回车发送…" onkeydown="if(event.key==='Enter')send()">
      <button class="send" id="btn" onclick="send()">发送</button>
    </div>
    <footer>Powered by DeepSeek · FastAPI · SSE Streaming · Tool Calling</footer>
  </div>
</div>

<script>
const box = document.getElementById("messages");
const input = document.getElementById("input");
const btn = document.getElementById("btn");
const chips = document.getElementById("chips");
const timer = document.getElementById("timer");

let stats = { q: 0, tools: 0, last: null, msgs: 0 };
let histTimer = null;

/* ---------- 工具函数 ---------- */
const scroll = () => { box.scrollTop = box.scrollHeight; };
const md = t => DOMPurify.sanitize(marked.parse(t));
function fill(b) { input.value = b.textContent; input.focus(); }

function decorateCode(bubble) {
  bubble.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;
    const b = document.createElement("button");
    b.className = "copy-btn"; b.textContent = "复制";
    b.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code").textContent);
      b.textContent = "已复制"; setTimeout(() => b.textContent = "复制", 1500);
    };
    pre.appendChild(b);
  });
}

function renderSteps(container, steps) {
  container.innerHTML = "";
  steps.forEach(s => {
    const d = document.createElement("div");
    d.className = "step-card done";
    d.innerHTML = `<span class="tool">${s.tool}</span> <span class="args">${JSON.stringify(s.args)}</span><div class="result">→ ${s.result}</div>`;
    container.appendChild(d);
  });
}

/* ---------- 统计与历史 ---------- */
function saveStats() {
  document.getElementById("stQ").textContent = stats.q;
  document.getElementById("stT").textContent = stats.tools;
  document.getElementById("stS").textContent = stats.last ?? "-";
  document.getElementById("stM").textContent = stats.msgs;
}
function startTimer() {
  const t0 = Date.now();
  timer.textContent = "⏱ 0.0s";
  histTimer = setInterval(() => { timer.textContent = "⏱ " + ((Date.now() - t0) / 1000).toFixed(1) + "s"; }, 100);
}
function stopTimer() { clearInterval(histTimer); timer.textContent = ""; }

/* ---------- 历史会话（localStorage） ---------- */
let sessions = JSON.parse(localStorage.getItem("ops_sessions") || "[]");
let currentMsgs = [];

function renderHist(activeId) {
  const list = document.getElementById("histList");
  list.innerHTML = "";
  sessions.forEach(s => {
    const d = document.createElement("div");
    d.className = "hist-item" + (s.id === activeId ? " active" : "");
    d.textContent = "▸ " + s.title;
    d.onclick = () => loadSession(s.id);
    list.appendChild(d);
  });
}
function loadSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  currentMsgs = s.msgs;
  box.innerHTML = "";
  s.msgs.forEach(m => {
    if (m.role === "user") addUser(m.text);
    else {
      const el = addBot();
      el.querySelector(".bubble").innerHTML = md(m.answer);
      const sc = document.createElement("div");
      if (m.steps && m.steps.length) renderSteps(sc, m.steps);
      el.querySelector(".bubble").appendChild(sc);
      decorateCode(el.querySelector(".bubble"));
    }
  });
  chips.style.display = "none";
  renderHist(id);
}
function saveSession(userText, botAnswer, steps) {
  currentMsgs.push({ role: "user", text: userText });
  currentMsgs.push({ role: "bot", answer: botAnswer, steps });
  if (!currentMsgs._saved) {
    sessions.unshift({ id: Date.now(), title: userText.slice(0, 22), msgs: currentMsgs });
    sessions = sessions.slice(0, 8);
    currentMsgs._saved = true;
    renderHist(sessions[0].id);
  }
  localStorage.setItem("ops_sessions", JSON.stringify(sessions));
}
function newSession() {
  currentMsgs = [];
  box.innerHTML = "";
  chips.style.display = "flex";
  renderHist(null);
  document.getElementById("sidebar").classList.remove("open");
}

/* ---------- 消息渲染 ---------- */
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  box.appendChild(d); scroll();
}
function addBot() {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = `<div class="bubble"><span class="typing"><i></i><i></i><i></i></span><div class="step-zone"></div><div class="stream-text"></div></div>`;
  box.appendChild(d); scroll();
  return d;
}

/* ---------- 核心发送：SSE 流式 ---------- */
async function send() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  addUser(q);
  input.value = ""; chips.style.display = "none";
  btn.disabled = true; stats.q++; stats.msgs++; saveStats(); startTimer();

  const el = addBot();
  const bubble = el.querySelector(".bubble");
  const stepZone = el.querySelector(".step-zone");
  const textZone = el.querySelector(".stream-text");
  let buf = "";

  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      buf = `**请求失败（${resp.status}）**：${err.detail || "请稍后再试"}`;
      textZone.innerHTML = md(buf);
    } else {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = "", answerText = "", steps = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuf += decoder.decode(value, { stream: true });
        const blocks = sseBuf.split("\n\n");
        sseBuf = blocks.pop();  // 最后一块可能不完整，留到下一轮

        for (const block of blocks) {
          const evLine = block.split("\n").find(l => l.startsWith("event: "));
          const dataLine = block.split("\n").find(l => l.startsWith("data: "));
          if (!evLine || !dataLine) continue;
          const ev = evLine.slice(7).trim();
          const data = JSON.parse(dataLine.slice(6));

          if (ev === "delta") {
            answerText += data.text;
            textZone.classList.add("stream-text");
            textZone.textContent = answerText; scroll();
          } else if (ev === "tool_start") {
            const d = document.createElement("div");
            d.className = "step-card running";
            d.innerHTML = `<span class="tool">${data.tool}</span> <span class="args">${JSON.stringify(data.args)}</span>`;
            stepZone.appendChild(d); scroll();
          } else if (ev === "tool_result") {
            stats.tools++; saveStats();
            const card = stepZone.lastElementChild;
            if (card) {
              card.classList.remove("running"); card.classList.add("done");
              card.insertAdjacentHTML("beforeend", `<div class="result">→ ${data.result}</div>`);
            }
            steps.push(data); scroll();
          } else if (ev === "done") {
            steps = data.steps || steps;
            if (data.answer) { answerText = data.answer; }
            bubble.querySelector(".typing")?.remove();
            textZone.innerHTML = md(answerText);
            if (data.elapsed) { stats.last = data.elapsed; saveStats(); }
          } else if (ev === "error") {
            buf = data.answer || "服务出错";
            textZone.innerHTML = md(buf);
          }
        }
      }
      bubble.querySelector(".typing")?.remove();
      if (answerText) { textZone.innerHTML = md(answerText); }
      decorateCode(bubble);
      saveSession(q, answerText, steps);
    }
  } catch (e) {
    bubble.querySelector(".typing")?.remove();
    textZone.innerHTML = md("**网络错误**：" + e);
  }
  stopTimer();
  btn.disabled = false;
  input.focus();
}

renderHist(null); saveStats();
</script>
</body>
</html>
