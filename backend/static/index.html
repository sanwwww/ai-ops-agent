<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI 智能运维助手 Ops Agent</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; }
  .chat-box { width: 720px; height: 100vh; background: #fff; display: flex; flex-direction: column; box-shadow: 0 0 12px rgba(0,0,0,.08); }
  header { padding: 14px 20px; background: #1f6feb; color: #fff; font-size: 17px; font-weight: bold; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.6; }
  .user { background: #1f6feb; color: #fff; margin-left: auto; }
  .bot { background: #f1f3f5; }
  .steps { font-size: 12px; color: #666; background: #fafafa; border-left: 3px solid #1f6feb; padding: 6px 10px; margin-top: 6px; border-radius: 4px; }
  .input-row { display: flex; padding: 12px; border-top: 1px solid #eee; }
  input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  button { margin-left: 8px; padding: 10px 22px; background: #1f6feb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #999; }
</style>
</head>
<body>
<div class="chat-box">
  <header>AI 智能运维助手 Ops Agent</header>
  <div id="messages"></div>
  <div class="input-row">
    <input id="input" placeholder="例如：网站打不开了，帮我排查一下 baidu.com" onkeydown="if(event.key==='Enter')send()">
    <button id="btn" onclick="send()">发送</button>
  </div>
</div>
<script>
const box = document.getElementById("messages");
function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}
async function send() {
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, "user");
  input.value = "";
  btn.disabled = true;
  const botMsg = addMsg("正在分析…", "bot");
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q }),
    });
    const data = await resp.json();
    // 展示 Agent 每一步调用的工具（这是面试演示的亮点：能看到"思考过程"）
    let stepText = "";
    if (data.steps && data.steps.length) {
      stepText = "\n[Agent 排查过程]\n" + data.steps.map((s, i) =>
        `${i + 1}. 调用 ${s.tool}(${JSON.stringify(s.args)})\n   -> ${s.result}`).join("\n");
    }
    botMsg.textContent = data.answer + "\n" + stepText;
  } catch (e) {
    botMsg.textContent = "请求失败: " + e;
  }
  btn.disabled = false;
}
</script>
</body>
</html>
