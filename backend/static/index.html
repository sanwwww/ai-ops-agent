<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能运维助手 Ops Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }

  /* ---------- 三套主题变量（默认夜间） ---------- */
  :root, body[data-theme="dark"] {
    --bg: #070b12; --grid: rgba(27, 40, 57, .22); --haze: rgba(34, 211, 238, .06);
    --panel: rgba(13, 20, 32, .92); --panel2: #121b2b; --border: #1b2839;
    --text: #e6edf3; --muted: #7d8ca1;
    --accent: #22d3ee; --accent2: #0ea5e9; --glow: 0 0 12px rgba(34, 211, 238, .35);
    --user-a: #1d4ed8; --user-b: #1e3a8a; --user-border: #2f5cc4;
    --bubble-bot: rgba(18, 27, 43, .88);
    --step-bg: rgba(6, 10, 16, .8); --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    --codechip-bg: #060a10; --codechip-text: #7dd3fc;
    --mono: "JetBrains Mono", Consolas, monospace;
    --disp: "Orbitron", "JetBrains Mono", sans-serif;
  }
  body[data-theme="light"] {
    --bg: #f2f4f8; --grid: rgba(20, 60, 110, .07); --haze: rgba(11, 116, 208, .05);
    --panel: rgba(255, 255, 255, .94); --panel2: #edf1f7; --border: #d5dde8;
    --text: #182130; --muted: #5a6a80;
    --accent: #0b74d0; --accent2: #0891b2; --glow: 0 0 10px rgba(11, 116, 208, .3);
    --user-a: #2563eb; --user-b: #1d4ed8; --user-border: #1d4ed8;
    --bubble-bot: #f7f9fc;
    --step-bg: #eef2f8; --ok: #15803d; --warn: #b45309; --danger: #dc2626;
    --codechip-bg: #e8eef6; --codechip-text: #0b63b8;
  }
  body[data-theme="warm"] {
    --bg: #c9e5cd; --grid: rgba(30, 80, 40, .10); --haze: rgba(47, 158, 99, .07);
    --panel: rgba(214, 236, 218, .94); --panel2: #cfe7d4; --border: #9ec4a4;
    --text: #243528; --muted: #55705c;
    --accent: #2f9e63; --accent2: #3aa876; --glow: 0 0 10px rgba(47, 158, 99, .3);
    --user-a: #2f9e63; --user-b: #20714a; --user-border: #20714a;
    --bubble-bot: #e0f2e3;
    --step-bg: #dcefe0; --ok: #1f7a45; --warn: #a16207; --danger: #b91c1c;
    --codechip-bg: #dcefe0; --codechip-text: #1f6e48;
  }

  body {
    font-family: "Microsoft YaHei", -apple-system, sans-serif; color: var(--text);
    height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, var(--haze), transparent),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--bg);
    background-size: auto, 42px 42px, 42px 42px, auto;
    transition: background .3s, color .3s;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .app { display: flex; height: 100vh; }

  /* ---------- 开机动画 ---------- */
  #boot { position: fixed; inset: 0; z-index: 99; background: #05080e; display: flex; align-items: center; justify-content: center; transition: opacity .6s; cursor: pointer; }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-box { text-align: center; }
  .boot-logo { font-family: var(--disp); font-size: 34px; letter-spacing: 8px; color: #22d3ee; text-shadow: 0 0 20px rgba(34, 211, 238, .6); animation: bootIn 1s ease-out; }
  @keyframes bootIn { from { opacity: 0; letter-spacing: 20px; filter: blur(6px); } to { opacity: 1; letter-spacing: 8px; filter: none; } }
  .boot-sub { font-family: var(--mono); font-size: 11px; color: #4a586e; letter-spacing: 4px; margin: 10px 0 26px; }
  .boot-bar { width: 280px; height: 3px; background: #101a28; margin: 0 auto 18px; border-radius: 2px; overflow: hidden; }
  .boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0ea5e9, #22d3ee); box-shadow: 0 0 10px rgba(34, 211, 238, .7); animation: bootBar 2s ease-out forwards; }
  @keyframes bootBar { to { width: 100%; } }
  .boot-log { font-family: var(--mono); font-size: 11px; color: #556578; text-align: left; width: 300px; margin: 0 auto; min-height: 90px; }
  .boot-log div { animation: bootIn .3s ease-out; }

  /* ---------- 侧栏 ---------- */
  .sidebar { width: 250px; min-width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; transition: margin-left .25s; }
  .app.side-hidden .sidebar { margin-left: -250px; }
  .logo { position: relative; padding: 20px 16px; border-bottom: 1px solid var(--border); }
  .logo::before, .logo::after { content: ""; position: absolute; width: 14px; height: 14px; }
  .logo::before { top: 8px; left: 8px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .logo::after { bottom: 8px; right: 8px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .logo h1 { font-family: var(--disp); font-size: 17px; letter-spacing: 3px; color: var(--accent); text-shadow: var(--glow); display: flex; align-items: center; gap: 9px; }
  .logo h1 .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .logo p { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 2px; }
  .sec { padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .sec h3 { font-family: var(--mono); font-size: 10.5px; color: var(--accent); letter-spacing: 2px; margin-bottom: 10px; }
  .sec h3::before { content: "▸ "; }
  .kv { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
  .kv .ok { color: var(--ok); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { position: relative; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 6px; text-align: center; overflow: hidden; }
  .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .5; }
  .stat b { display: block; font-family: var(--disp); font-size: 18px; color: var(--accent); }
  .stat span { font-size: 10.5px; color: var(--muted); }
  .theme-row { display: flex; gap: 6px; }
  .theme-btn { flex: 1; font-size: 11.5px; padding: 7px 0; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; }
  .theme-btn:hover { color: var(--accent); }
  .theme-btn.active { color: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }
  .hist-item { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
  .hist-item::before { content: "» "; color: var(--accent); }
  .hist-item:hover { background: var(--panel2); color: var(--text); }
  .hist-item.active { border-color: var(--accent); color: var(--text); background: transparent; }
  .btn-new { font-family: var(--mono); width: 100%; padding: 9px; background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; letter-spacing: 1px; }
  .btn-new:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px; overflow: hidden; }
  .topbar::after { content: ""; position: absolute; bottom: 0; left: 0; height: 1.5px; width: 30%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 4s linear infinite; }
  @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  .topbar .burger { display: none; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  .topbar .side-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .topbar .side-btn:hover { color: var(--accent); border-color: var(--accent); }
  .topbar b { letter-spacing: 1px; }
  .topbar .model { font-family: var(--mono); color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .topbar .timer { margin-left: auto; font-family: var(--mono); color: var(--warn); font-size: 12px; }

  #messages { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .msg { margin: 14px 0; max-width: 88%; }
  .msg .bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.75; font-size: 14.5px; word-break: break-word; }
  .user { margin-left: auto; }
  .user .bubble {
    background: linear-gradient(135deg, var(--user-a), var(--user-b)); color: #fff;
    border: 1px solid var(--user-border); border-bottom-right-radius: 3px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .bot .bubble p { margin: 6px 0; }
  .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 { margin: 10px 0 6px; font-size: 15px; color: var(--accent); }
  .bot .bubble ul { padding-left: 20px; }
  .bot .bubble pre { position: relative; background: #0a0e14; border: 1px solid #1c2c42; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bot .bubble pre::before { content: "$ "; color: var(--ok); font-family: var(--mono); }
  .bot .bubble pre code { font-family: var(--mono); color: #9ecbff; }
  .bot .bubble code { font-family: var(--mono); font-size: 13px; background: var(--codechip-bg); padding: 1px 5px; border-radius: 4px; color: var(--codechip-text); }
  .bot .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bot .bubble th, .bot .bubble td { border: 1px solid var(--border); padding: 5px 10px; }
  .bot .bubble th { background: var(--panel2); color: var(--accent); font-family: var(--mono); font-size: 12px; }
  .bot .bubble blockquote { border-left: 3px solid var(--warn); padding-left: 10px; color: var(--muted); margin: 6px 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: #122036; color: #7d8ca1; border: 1px solid #24344c; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; cursor: pointer; }
  .copy-btn:hover { color: #22d3ee; border-color: #22d3ee; }
  .stream-text { white-space: pre-wrap; }

  .step-zone { position: relative; }
  .steps-toggle {
    font-family: var(--mono); font-size: 12px; color: var(--accent); cursor: pointer;
    background: var(--step-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; margin: 8px 0 4px; display: inline-block; user-select: none;
  }
  .steps-toggle:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .steps-pop {
    display: none; position: absolute; left: 0; top: calc(100% + 4px); z-index: 30;
    min-width: 280px; max-width: 440px; max-height: 260px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); padding: 8px;
  }
  .steps-pop.open { display: block; animation: popIn .15s ease-out; }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .step-card {
    font-family: var(--mono); background: var(--step-bg); border: 1px solid var(--border);
    border-left: 2px solid var(--warn); border-radius: 4px; padding: 8px 12px; margin: 6px 0; font-size: 12px;
  }
  .step-card .tool { color: var(--warn); font-weight: bold; }
  .step-card .tool::before { content: "⚙ "; }
  .step-card .args { color: var(--muted); font-size: 11px; }
  .step-card .result { color: var(--ok); margin-top: 4px; white-space: pre-wrap; }
  .step-card .result::before { content: "→ "; color: var(--muted); }
  .step-card.running { border-left-color: var(--accent); animation: runPulse 1.2s infinite; }
  .step-card.running .tool { color: var(--accent); }
  @keyframes runPulse { 50% { box-shadow: 0 0 10px var(--glow); } }
  .step-card.done { border-left-color: var(--ok); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 8px; }
  .chips button {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer;
    padding: 8px 16px; background: var(--panel2); border: 1px solid var(--border);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: all .15s;
  }
  .chips button:hover { color: var(--accent); border-color: var(--accent); }

  .input-row { display: flex; gap: 10px; padding: 14px 26px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  input {
    flex: 1; padding: 12px 16px; background: var(--panel2); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; color: var(--text); outline: none; font-family: var(--mono);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  input:focus { border-color: var(--accent); box-shadow: var(--glow); }
  input::placeholder { color: var(--muted); opacity: .6; }
  button.send {
    font-family: var(--disp); font-size: 13px; letter-spacing: 2px; cursor: pointer; color: #04121a;
    padding: 12px 28px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2));
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all .15s;
  }
  button.send:hover:not(:disabled) { box-shadow: var(--glow); }
  button.send:disabled { opacity: .45; }
  footer { text-align: center; font-family: var(--mono); font-size: 10.5px; color: var(--muted); opacity: .7; padding: 0 0 8px; letter-spacing: 1px; background: var(--panel); }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  @media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 10; left: -250px; transition: left .25s; height: 100vh; }
    .sidebar.open { left: 0; }
    .topbar .burger { display: block; }
    #messages, .chips, .input-row { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body data-theme="dark">

<div id="boot">
  <div class="boot-box">
    <div class="boot-logo">OPS AGENT</div>
    <div class="boot-sub">AI NETWORK OPERATIONS CONSOLE</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-log" id="bootLog"></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <h1><span class="pulse"></span>OPS AGENT</h1>
      <p>AI NETWORK OPERATIONS</p>
    </div>
    <div class="sec">
      <h3>AGENT 状态</h3>
      <div class="kv"><span>模型</span><span>deepseek-chat</span></div>
      <div class="kv"><span>服务状态</span><span class="ok">● ONLINE</span></div>
      <div class="kv"><span>排查链路</span><span>DNS→PING→PORT→HTTP</span></div>
    </div>
    <div class="sec">
      <h3>本次会话</h3>
      <div class="stat-grid">
        <div class="stat"><b id="stQ">0</b><span>提问数</span></div>
        <div class="stat"><b id="stT">0</b><span>工具调用</span></div>
        <div class="stat"><b id="stS">-</b><span>最近耗时/s</span></div>
        <div class="stat"><b id="stM">1</b><span>会话轮次</span></div>
      </div>
    </div>
    <div class="sec">
      <h3>界面主题</h3>
      <div class="theme-row">
        <button class="theme-btn" data-t="dark" onclick="setTheme('dark')">夜间</button>
        <button class="theme-btn" data-t="light" onclick="setTheme('light')">日间</button>
        <button class="theme-btn" data-t="warm" onclick="setTheme('warm')">护眼</button>
      </div>
    </div>
    <div class="sec" style="flex:1">
      <h3>历史会话</h3>
      <div id="histList"></div>
      <button class="btn-new" onclick="newSession()">＋ 新建会话</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="side-btn" onclick="document.querySelector('.app').classList.toggle('side-hidden')" title="收起/展开侧栏">◧</button>
      <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <b>网络故障智能排查控制台</b>
      <span class="model">LLM · TOOL CALLING · SSE</span>
      <span class="timer" id="timer"></span>
    </div>
    <div id="messages"></div>
    <div class="chips" id="chips">
      <button onclick="fill(this)">网站打不开了，帮我排查 example.com</button>
      <button onclick="fill(this)">baidu.com 的 443 端口通吗</button>
      <button onclick="fill(this)">检查 https://www.baidu.com 是否正常</button>
    </div>
    <div class="input-row">
      <input id="input" maxlength="500" placeholder="描述你的运维问题，回车发送…" onkeydown="if(event.key==='Enter')send()">
      <button class="send" id="btn" onclick="send()">发送</button>
    </div>
    <footer>POWERED BY DEEPSEEK · FASTAPI · SSE STREAMING · TOOL CALLING</footer>
  </div>
</div>

<script>
/* ---------- 开机动画 ---------- */
(function () {
  const lines = [
    "[ OK ] INITIALIZING AGENT CORE",
    "[ OK ] LOADING TOOL REGISTRY · 4 TOOLS",
    "[ OK ] ESTABLISHING LLM LINK · DEEPSEEK",
    "[ OK ] SSE CHANNEL READY",
    "SYSTEM ONLINE_"
  ];
  const log = document.getElementById("bootLog");
  let i = 0;
  const t = setInterval(() => {
    const d = document.createElement("div");
    d.textContent = lines[i]; log.appendChild(d); i++;
    if (i >= lines.length) clearInterval(t);
  }, 400);
  const finish = () => {
    clearInterval(t);
    const b = document.getElementById("boot");
    if (!b) return;
    b.classList.add("hide");
    setTimeout(() => b.remove(), 700);
  };
  setTimeout(finish, 2400);
  document.getElementById("boot").addEventListener("click", finish);
})();

/* ---------- 主题切换 ---------- */
function setTheme(t) {
  document.body.dataset.theme = t;
  localStorage.setItem("ops_theme", t);
  document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.t === t));
}
setTheme(localStorage.getItem("ops_theme") || "dark");

const box = document.getElementById("messages");
const input = document.getElementById("input");
const btn = document.getElementById("btn");
const chips = document.getElementById("chips");
const timer = document.getElementById("timer");

let stats = { q: 0, tools: 0, last: null, msgs: 0 };
let histTimer = null;

/* ---------- 工具函数 ---------- */
const scroll = () => { box.scrollTop = box.scrollHeight; };
const md = t => DOMPurify.sanitize(marked.parse(t));
function fill(b) { input.value = b.textContent; input.focus(); }

function decorateCode(bubble) {
  bubble.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;
    const b = document.createElement("button");
    b.className = "copy-btn"; b.textContent = "复制";
    b.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code").textContent);
      b.textContent = "已复制"; setTimeout(() => b.textContent = "复制", 1500);
    };
    pre.appendChild(b);
  });
}

function stepsBarText(n, running) {
  return running ? `⚙ 正在排查… 已调用 ${n} 次（点击展开）` : `▸ Agent 排查过程（${n} 次工具调用）`;
}
function ensureStepUI(zone) {
  if (!zone.querySelector(".steps-pop")) {
    zone.innerHTML = `<div class="steps-toggle"></div><div class="steps-pop"></div>`;
    zone.querySelector(".steps-toggle").onclick = () =>
      zone.querySelector(".steps-pop").classList.toggle("open");
  }
  return { bar: zone.querySelector(".steps-toggle"), pop: zone.querySelector(".steps-pop") };
}
function renderSteps(container, steps) {
  const { bar, pop } = ensureStepUI(container);
  pop.innerHTML = steps.map(s =>
    `<div class="step-card done"><span class="tool">${s.tool}</span> <span class="args">${JSON.stringify(s.args)}</span><div class="result">${s.result}</div></div>`).join("");
  bar.textContent = stepsBarText(steps.length, false);
}

/* ---------- 统计与历史 ---------- */
function saveStats() {
  document.getElementById("stQ").textContent = stats.q;
  document.getElementById("stT").textContent = stats.tools;
  document.getElementById("stS").textContent = stats.last ?? "-";
  document.getElementById("stM").textContent = stats.msgs;
}
function startTimer() {
  const t0 = Date.now();
  timer.textContent = "⏱ 0.0s";
  histTimer = setInterval(() => { timer.textContent = "⏱ " + ((Date.now() - t0) / 1000).toFixed(1) + "s"; }, 100);
}
function stopTimer() { clearInterval(histTimer); timer.textContent = ""; }

/* ---------- 历史会话（localStorage） ---------- */
let sessions = JSON.parse(localStorage.getItem("ops_sessions") || "[]");
let currentMsgs = [];

function renderHist(activeId) {
  const list = document.getElementById("histList");
  list.innerHTML = "";
  sessions.forEach(s => {
    const d = document.createElement("div");
    d.className = "hist-item" + (s.id === activeId ? " active" : "");
    d.textContent = s.title;
    d.onclick = () => loadSession(s.id);
    list.appendChild(d);
  });
}
function loadSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  currentMsgs = s.msgs;
  box.innerHTML = "";
  s.msgs.forEach(m => {
    if (m.role === "user") addUser(m.text);
    else {
      const el = addBot();
      el.querySelector(".bubble").innerHTML = md(m.answer);
      const sc = document.createElement("div");
      if (m.steps && m.steps.length) renderSteps(sc, m.steps);
      el.querySelector(".bubble").appendChild(sc);
      decorateCode(el.querySelector(".bubble"));
    }
  });
  chips.style.display = "none";
  renderHist(id);
}
function saveSession(userText, botAnswer, steps) {
  currentMsgs.push({ role: "user", text: userText });
  currentMsgs.push({ role: "bot", answer: botAnswer, steps });
  if (!currentMsgs._saved) {
    sessions.unshift({ id: Date.now(), title: userText.slice(0, 22), msgs: currentMsgs });
    sessions = sessions.slice(0, 8);
    currentMsgs._saved = true;
    renderHist(sessions[0].id);
  }
  localStorage.setItem("ops_sessions", JSON.stringify(sessions));
}
function newSession() {
  currentMsgs = [];
  box.innerHTML = "";
  chips.style.display = "flex";
  renderHist(null);
  document.getElementById("sidebar").classList.remove("open");
}

/* ---------- 消息渲染 ---------- */
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  box.appendChild(d); scroll();
}
function addBot() {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = `<div class="bubble"><span class="typing"><i></i><i></i><i></i></span><div class="step-zone"></div><div class="stream-text"></div></div>`;
  box.appendChild(d); scroll();
  return d;
}

/* ---------- 核心发送：SSE 流式 ---------- */
async function send() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  addUser(q);
  input.value = ""; chips.style.display = "none";
  btn.disabled = true; stats.q++; stats.msgs++; saveStats(); startTimer();

  const el = addBot();
  const bubble = el.querySelector(".bubble");
  const stepZone = el.querySelector(".step-zone");
  const textZone = el.querySelector(".stream-text");
  let buf = "";

  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      buf = `**请求失败（${resp.status}）**：${err.detail || "请稍后再试"}`;
      textZone.innerHTML = md(buf);
    } else {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = "", answerText = "", steps = [], stepCount = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuf += decoder.decode(value, { stream: true });
        const blocks = sseBuf.split("\n\n");
        sseBuf = blocks.pop();

        for (const block of blocks) {
          const evLine = block.split("\n").find(l => l.startsWith("event: "));
          const dataLine = block.split("\n").find(l => l.startsWith("data: "));
          if (!evLine || !dataLine) continue;
          const ev = evLine.slice(7).trim();
          const data = JSON.parse(dataLine.slice(6));

          if (ev === "delta") {
            answerText += data.text;
            textZone.textContent = answerText; scroll();
          } else if (ev === "tool_start") {
            const ui = ensureStepUI(stepZone);
            const d = document.createElement("div");
            d.className = "step-card running";
            d.innerHTML = `<span class="tool">${data.tool}</span> <span class="args">${JSON.stringify(data.args)}</span>`;
            ui.pop.appendChild(d);
            stepCount++;
            ui.bar.textContent = stepsBarText(stepCount, true);
            scroll();
          } else if (ev === "tool_result") {
            stats.tools++; saveStats();
            const ui = ensureStepUI(stepZone);
            const card = ui.pop.lastElementChild;
            if (card) {
              card.classList.remove("running"); card.classList.add("done");
              card.insertAdjacentHTML("beforeend", `<div class="result">${data.result}</div>`);
            }
            ui.bar.textContent = stepsBarText(stepCount, true);
            steps.push(data); scroll();
          } else if (ev === "done") {
            steps = data.steps || steps;
            const zbar = stepZone.querySelector(".steps-toggle");
            if (zbar) zbar.textContent = stepsBarText(steps.length, false);
            if (data.answer) { answerText = data.answer; }
            bubble.querySelector(".typing")?.remove();
            textZone.innerHTML = md(answerText);
            if (data.elapsed) { stats.last = data.elapsed; saveStats(); }
          } else if (ev === "error") {
            buf = data.answer || "服务出错";
            textZone.innerHTML = md(buf);
          }
        }
      }
      bubble.querySelector(".typing")?.remove();
      if (answerText) { textZone.innerHTML = md(answerText); }
      decorateCode(bubble);
      saveSession(q, answerText, steps);
    }
  } catch (e) {
    bubble.querySelector(".typing")?.remove();
    textZone.innerHTML = md("**网络错误**：" + e);
  }
  stopTimer();
  btn.disabled = false;
  input.focus();
}

renderHist(null); saveStats();
</script>
</body>
