<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能运维助手 Ops Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --bg: #070b12; --panel: #0d1420; --panel2: #121b2b; --border: #1b2839;
    --text: #e6edf3; --muted: #7d8ca1; --cyan: #22d3ee; --blue: #3b82f6;
    --green: #34d399; --amber: #fbbf24; --red: #f87171;
    --mono: "JetBrains Mono", Consolas, monospace;
    --disp: "Orbitron", "JetBrains Mono", sans-serif;
    --glow: 0 0 12px rgba(34, 211, 238, .35);
  }
  body {
    font-family: "Microsoft YaHei", -apple-system, sans-serif; color: var(--text);
    height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(34, 211, 238, .06), transparent),
      linear-gradient(rgba(27, 40, 57, .22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27, 40, 57, .22) 1px, transparent 1px),
      var(--bg);
    background-size: auto, 42px 42px, 42px 42px, auto;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #1e2c42; border-radius: 3px; }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .sidebar { width: 250px; min-width: 250px; background: rgba(13, 20, 32, .92); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .logo { position: relative; padding: 20px 16px; border-bottom: 1px solid var(--border); }
  .logo::before, .logo::after { content: ""; position: absolute; width: 14px; height: 14px; }
  .logo::before { top: 8px; left: 8px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .logo::after { bottom: 8px; right: 8px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .logo h1 { font-family: var(--disp); font-size: 17px; letter-spacing: 3px; color: var(--cyan); text-shadow: var(--glow); display: flex; align-items: center; gap: 9px; }
  .logo h1 .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .logo p { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 2px; }
  .sec { padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .sec h3 { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); letter-spacing: 2px; margin-bottom: 10px; }
  .sec h3::before { content: "▸ "; }
  .kv { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
  .kv .ok { color: var(--green); text-shadow: 0 0 6px rgba(52, 211, 153, .5); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { position: relative; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 6px; text-align: center; overflow: hidden; }
  .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: .5; }
  .stat b { display: block; font-family: var(--disp); font-size: 18px; color: var(--cyan); text-shadow: var(--glow); }
  .stat span { font-size: 10.5px; color: var(--muted); }
  .hist-item { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
  .hist-item::before { content: "» "; color: var(--cyan); }
  .hist-item:hover { background: var(--panel2); color: var(--text); }
  .hist-item.active { border-color: rgba(34, 211, 238, .45); color: var(--text); background: rgba(34, 211, 238, .05); }
  .btn-new { font-family: var(--mono); width: 100%; padding: 9px; background: transparent; border: 1px dashed #27394f; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; letter-spacing: 1px; }
  .btn-new:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow); }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(13, 20, 32, .92); border-bottom: 1px solid var(--border); font-size: 13px; overflow: hidden; }
  .topbar::after { content: ""; position: absolute; bottom: 0; left: 0; height: 1.5px; width: 30%; background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: scan 4s linear infinite; }
  @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  .topbar .burger { display: none; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  .topbar b { letter-spacing: 1px; }
  .topbar .model { font-family: var(--mono); color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .topbar .timer { margin-left: auto; font-family: var(--mono); color: var(--amber); font-size: 12px; text-shadow: 0 0 8px rgba(251, 191, 36, .4); }

  #messages { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .msg { margin: 14px 0; max-width: 88%; }
  .msg .bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.75; font-size: 14.5px; word-break: break-word; }
  .user { margin-left: auto; }
  .user .bubble {
    background: linear-gradient(135deg, #1d4ed8, #1e3a8a); color: #fff;
    border: 1px solid #2f5cc4; border-bottom-right-radius: 3px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .bot .bubble { background: rgba(18, 27, 43, .88); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .bot .bubble p { margin: 6px 0; }
  .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 { margin: 10px 0 6px; font-size: 15px; color: var(--cyan); }
  .bot .bubble ul { padding-left: 20px; }
  .bot .bubble pre { position: relative; background: #060a10; border: 1px solid #1c2c42; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bot .bubble pre::before { content: "$ "; color: var(--green); font-family: var(--mono); }
  .bot .bubble pre code { font-family: var(--mono); color: #9ecbff; }
  .bot .bubble code { font-family: var(--mono); font-size: 13px; background: #060a10; padding: 1px 5px; border-radius: 4px; color: #7dd3fc; }
  .bot .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bot .bubble th, .bot .bubble td { border: 1px solid #24344c; padding: 5px 10px; }
  .bot .bubble th { background: #14203266; color: var(--cyan); font-family: var(--mono); font-size: 12px; }
  .bot .bubble blockquote { border-left: 3px solid var(--amber); padding-left: 10px; color: var(--muted); margin: 6px 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: #122036; color: var(--muted); border: 1px solid #24344c; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; cursor: pointer; }
  .copy-btn:hover { color: var(--cyan); border-color: var(--cyan); }
  .stream-text { white-space: pre-wrap; }

  .step-card {
    font-family: var(--mono); background: rgba(6, 10, 16, .8); border: 1px solid var(--border);
    border-left: 2px solid var(--amber); border-radius: 4px; padding: 8px 12px; margin: 8px 0; font-size: 12px;
  }
  .step-card .tool { color: var(--amber); font-weight: bold; }
  .step-card .tool::before { content: "⚙ "; }
  .step-card .args { color: var(--muted); font-size: 11px; }
  .step-card .result { color: var(--green); margin-top: 4px; white-space: pre-wrap; }
  .step-card .result::before { content: "→ "; color: var(--muted); }
  .step-card.running { border-left-color: var(--cyan); animation: runPulse 1.2s infinite; }
  .step-card.running .tool { color: var(--cyan); }
  @keyframes runPulse { 50% { box-shadow: 0 0 10px rgba(34, 211, 238, .25); } }
  .step-card.done { border-left-color: var(--green); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 8px; }
  .chips button {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer;
    padding: 8px 16px; background: rgba(18, 27, 43, .7); border: 1px solid var(--border);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: all .15s;
  }
  .chips button:hover { color: var(--cyan); border-color: var(--cyan); text-shadow: 0 0 8px rgba(34, 211, 238, .5); }

  .input-row { display: flex; gap: 10px; padding: 14px 26px 16px; background: rgba(13, 20, 32, .92); border-top: 1px solid var(--border); }
  input {
    flex: 1; padding: 12px 16px; background: rgba(6, 10, 16, .8); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; color: var(--text); outline: none; font-family: var(--mono);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  input:focus { border-color: var(--cyan); box-shadow: var(--glow); }
  input::placeholder { color: #4a586e; }
  button.send {
    font-family: var(--disp); font-size: 13px; letter-spacing: 2px; cursor: pointer; color: #04121a;
    padding: 12px 28px; border: none; background: linear-gradient(135deg, var(--cyan), #0ea5e9);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all .15s;
  }
  button.send:hover:not(:disabled) { box-shadow: 0 0 18px rgba(34, 211, 238, .55); }
  button.send:disabled { background: #1a2c42; color: #4a586e; }
  footer { text-align: center; font-family: var(--mono); font-size: 10.5px; color: #3e4a5e; padding: 0 0 8px; letter-spacing: 1px; background: rgba(13, 20, 32, .92); }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  @media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 10; left: -250px; transition: left .25s; height: 100vh; }
    .sidebar.open { left: 0; }
    .topbar .burger { display: block; }
    #messages, .chips, .input-row { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <h1><span class="pulse"></span>OPS AGENT</h1>
      <p>AI NETWORK OPERATIONS</p>
    </div>
    <div class="sec">
      <h3>AGENT 状态</h3>
      <div class="kv"><span>模型</span><span>deepseek-chat</span></div>
      <div class="kv"><span>服务状态</span><span class="ok">● ONLINE</span></div>
      <div class="kv"><span>排查链路</span><span>DNS→PING→PORT→HTTP</span></div>
    </div>
    <div class="sec">
      <h3>本次会话</h3>
      <div class="stat-grid">
        <div class="stat"><b id="stQ">0</b><span>提问数</span></div>
        <div class="stat"><b id="stT">0</b><span>工具调用</span></div>
        <div class="stat"><b id="stS">-</b><span>最近耗时/s</span></div>
        <div class="stat"><b id="stM">1</b><span>会话轮次</span></div>
      </div>
    </div>
    <div class="sec" style="flex:1">
      <h3>历史会话</h3>
      <div id="histList"></div>
      <button class="btn-new" onclick="newSession()">＋ 新建会话</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <b>网络故障智能排查控制台</b>
      <span class="model">LLM · TOOL CALLING · SSE</span>
      <span class="timer" id="timer"></span>
    </div>
    <div id="messages"></div>
    <div class="chips" id="chips">
      <button onclick="fill(this)">网站打不开了，帮我排查 example.com</button>
      <button onclick="fill(this)">baidu.com 的 443 端口通吗</button>
      <button onclick="fill(this)">检查 https://www.baidu.com 是否正常</button>
    </div>
    <div class="input-row">
      <input id="input" maxlength="500" placeholder="描述你的运维问题，回车发送…" onkeydown="if(event.key==='Enter')send()">
      <button class="send" id="btn" onclick="send()">发送</button>
    </div>
    <footer>POWERED BY DEEPSEEK · FASTAPI · SSE STREAMING · TOOL CALLING</footer>
  </div>
</div>

<script>
const box = document.getElementById("messages");
const input = document.getElementById("input");
const btn = document.getElementById("btn");
const chips = document.getElementById("chips");
const timer = document.getElementById("timer");

let stats = { q: 0, tools: 0, last: null, msgs: 0 };
let histTimer = null;

/* ---------- 工具函数 ---------- */
const scroll = () => { box.scrollTop = box.scrollHeight; };
const md = t => DOMPurify.sanitize(marked.parse(t));
function fill(b) { input.value = b.textContent; input.focus(); }

function decorateCode(bubble) {
  bubble.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;
    const b = document.createElement("button");
    b.className = "copy-btn"; b.textContent = "复制";
    b.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code").textContent);
      b.textContent = "已复制"; setTimeout(() => b.textContent = "复制", 1500);
    };
    pre.appendChild(b);
  });
}

function renderSteps(container, steps) {
  container.innerHTML = "";
  steps.forEach(s => {
    const d = document.createElement("div");
    d.className = "step-card done";
    d.innerHTML = `<span class="tool">${s.tool}</span> <span class="args">${JSON.stringify(s.args)}</span><div class="result">${s.result}</div>`;
    container.appendChild(d);
  });
}

/* ---------- 统计与历史 ---------- */
function saveStats() {
  document.getElementById("stQ").textContent = stats.q;
  document.getElementById("stT").textContent = stats.tools;
  document.getElementById("stS").textContent = stats.last ?? "-";
  document.getElementById("stM").textContent = stats.msgs;
}
function startTimer() {
  const t0 = Date.now();
  timer.textContent = "⏱ 0.0s";
  histTimer = setInterval(() => { timer.textContent = "⏱ " + ((Date.now() - t0) / 1000).toFixed(1) + "s"; }, 100);
}
function stopTimer() { clearInterval(histTimer); timer.textContent = ""; }

/* ---------- 历史会话（localStorage） ---------- */
let sessions = JSON.parse(localStorage.getItem("ops_sessions") || "[]");
let currentMsgs = [];

function renderHist(activeId) {
  const list = document.getElementById("histList");
  list.innerHTML = "";
  sessions.forEach(s => {
    const d = document.createElement("div");
    d.className = "hist-item" + (s.id === activeId ? " active" : "");
    d.textContent = s.title;
    d.onclick = () => loadSession(s.id);
    list.appendChild(d);
  });
}
function loadSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  currentMsgs = s.msgs;
  box.innerHTML = "";
  s.msgs.forEach(m => {
    if (m.role === "user") addUser(m.text);
    else {
      const el = addBot();
      el.querySelector(".bubble").innerHTML = md(m.answer);
      const sc = document.createElement("div");
      if (m.steps && m.steps.length) renderSteps(sc, m.steps);
      el.querySelector(".bubble").appendChild(sc);
      decorateCode(el.querySelector(".bubble"));
    }
  });
  chips.style.display = "none";
  renderHist(id);
}
function saveSession(userText, botAnswer, steps) {
  currentMsgs.push({ role: "user", text: userText });
  currentMsgs.push({ role: "bot", answer: botAnswer, steps });
  if (!currentMsgs._saved) {
    sessions.unshift({ id: Date.now(), title: userText.slice(0, 22), msgs: currentMsgs });
    sessions = sessions.slice(0, 8);
    currentMsgs._saved = true;
    renderHist(sessions[0].id);
  }
  localStorage.setItem("ops_sessions", JSON.stringify(sessions));
}
function newSession() {
  currentMsgs = [];
  box.innerHTML = "";
  chips.style.display = "flex";
  renderHist(null);
  document.getElementById("sidebar").classList.remove("open");
}

/* ---------- 消息渲染 ---------- */
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  box.appendChild(d); scroll();
}
function addBot() {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = `<div class="bubble"><span class="typing"><i></i><i></i><i></i></span><div class="step-zone"></div><div class="stream-text"></div></div>`;
  box.appendChild(d); scroll();
  return d;
}

/* ---------- 核心发送：SSE 流式 ---------- */
async function send() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  addUser(q);
  input.value = ""; chips.style.display = "none";
  btn.disabled = true; stats.q++; stats.msgs++; saveStats(); startTimer();

  const el = addBot();
  const bubble = el.querySelector(".bubble");
  const stepZone = el.querySelector(".step-zone");
  const textZone = el.querySelector(".stream-text");
  let buf = "";

  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      buf = `**请求失败（${resp.status}）**：${err.detail || "请稍后再试"}`;
      textZone.innerHTML = md(buf);
    } else {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = "", answerText = "", steps = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuf += decoder.decode(value, { stream: true });
        const blocks = sseBuf.split("\n\n");
        sseBuf = blocks.pop();

        for (const block of blocks) {
          const evLine = block.split("\n").find(l => l.startsWith("event: "));
          const dataLine = block.split("\n").find(l => l.startsWith("data: "));
          if (!evLine || !dataLine) continue;
          const ev = evLine.slice(7).trim();
          const data = JSON.parse(dataLine.slice(6));

          if (ev === "delta") {
            answerText += data.text;
            textZone.textContent = answerText; scroll();
          } else if (ev === "tool_start") {
            const d = document.createElement("div");
            d.className = "step-card running";
            d.innerHTML = `<span class="tool">${data.tool}</span> <span class="args">${JSON.stringify(data.args)}</span>`;
            stepZone.appendChild(d); scroll();
          } else if (ev === "tool_result") {
            stats.tools++; saveStats();
            const card = stepZone.lastElementChild;
            if (card) {
              card.classList.remove("running"); card.classList.add("done");
              card.insertAdjacentHTML("beforeend", `<div class="result">${data.result}</div>`);
            }
            steps.push(data); scroll();
          } else if (ev === "done") {
            steps = data.steps || steps;
            if (data.answer) { answerText = data.answer; }
            bubble.querySelector(".typing")?.remove();
            textZone.innerHTML = md(answerText);
            if (data.elapsed) { stats.last = data.elapsed; saveStats(); }
          } else if (ev === "error") {
            buf = data.answer || "服务出错";
            textZone.innerHTML = md(buf);
          }
        }
      }
      bubble.querySelector(".typing")?.remove();
      if (answerText) { textZone.innerHTML = md(answerText); }
      decorateCode(bubble);
      saveSession(q, answerText, steps);
    }
  } catch (e) {
    bubble.querySelector(".typing")?.remove();
    textZone.innerHTML = md("**网络错误**：" + e);
  }
  stopTimer();
  btn.disabled = false;
  input.focus();
}

renderHist(null); saveStats();
</script>
</body>
</html>
